<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Performance recording</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Segoe UI, system-ui, sans-serif; background: #f1f3f4; color: #202124; }
    .chrome { background: #fff; border: 1px solid #dadce0; margin: 16px; border-radius: 8px; overflow: hidden; }
    .bar { background: #f8f9fa; padding: 10px 14px; border-bottom: 1px solid #dadce0; font-size: 13px; color: #5f6368; }
    .body { padding: 16px 20px 20px; }
    .ruler { display: flex; justify-content: space-between; font-size: 11px; color: #80868b; margin-bottom: 8px; }
    .lane { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    .label { width: 88px; font-size: 12px; color: #5f6368; flex-shrink: 0; }
    .track { flex: 1; height: 22px; background: #f1f3f4; border-radius: 3px; position: relative; }
    .seg { position: absolute; top: 3px; height: 16px; border-radius: 2px; }
    .html { left: 2%; width: 12%; background: #1a73e8; }
    .paint { left: 16%; width: 10%; background: #34a853; }
    .long { left: 28%; width: 48%; background: #ea4335; }
    .lcpmark { left: 22%; width: 2px; height: 16px; background: #202124; }
    .note { font-size: 12px; color: #5f6368; margin-top: 12px; }
    .callout {
      margin: 0 16px 16px; background: #fff8f3; border: 1px solid #e8d5d1; border-radius: 8px;
      padding: 12px 14px; font-size: 14px; color: #5c4636;
    }
    .callout strong { color: #8b6f47; }
  </style>
</head>
<body>
  <div class="chrome">
    <div class="bar">Chrome DevTools · Performance</div>
    <div class="body">
      <div class="ruler"><span>0 s</span><span>1 s</span><span>2 s</span><span>3 s</span><span>4 s</span><span>5 s</span></div>
      <div class="lane">
        <div class="label">Main</div>
        <div class="track">
          <div class="seg html"></div>
          <div class="seg paint"></div>
          <div class="seg long"></div>
        </div>
      </div>
      <div class="lane">
        <div class="label">LCP</div>
        <div class="track"><div class="seg lcpmark"></div></div>
      </div>
      <div class="note">Long red task = script work after paint. Page can look ready and still feel stuck.</div>
    </div>
  </div>
  <div class="callout"><strong>Look here:</strong> long tasks on the main thread after the page has painted. That is often why taps feel laggy.</div>
</body>
</html>
