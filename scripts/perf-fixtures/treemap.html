<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Script breakdown</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Segoe UI, system-ui, sans-serif; background: #f1f3f4; color: #202124; }
    .chrome { background: #fff; border: 1px solid #dadce0; margin: 16px; border-radius: 8px; overflow: hidden; }
    .bar { background: #f8f9fa; padding: 10px 14px; border-bottom: 1px solid #dadce0; font-size: 13px; color: #5f6368; }
    .body { padding: 20px; }
    .treemap { display: grid; grid-template-columns: 2fr 1.2fr 1fr 0.8fr; grid-template-rows: 140px 90px; gap: 6px; height: 240px; }
    .cell { border-radius: 4px; padding: 10px; color: #fff; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; justify-content: space-between; }
    .a { background: #1a73e8; grid-row: 1 / 3; }
    .b { background: #ea4335; }
    .c { background: #f9ab00; color: #202124; }
    .d { background: #34a853; }
    .e { background: #9334e6; }
    .f { background: #5f6368; }
    .size { font-size: 11px; opacity: 0.9; font-weight: 500; }
    .callout {
      margin: 0 16px 16px; background: #fff8f3; border: 1px solid #e8d5d1; border-radius: 8px;
      padding: 12px 14px; font-size: 14px; color: #5c4636;
    }
    .callout strong { color: #8b6f47; }
  </style>
</head>
<body>
  <div class="chrome">
    <div class="bar">Lighthouse · Treemap / script breakdown</div>
    <div class="body">
      <div class="treemap">
        <div class="cell a"><span>main-app.js<br/>(site bundle)</span><span class="size">820 KB</span></div>
        <div class="cell b"><span>gtm.js</span><span class="size">310 KB</span></div>
        <div class="cell c"><span>analytics</span><span class="size">180 KB</span></div>
        <div class="cell d"><span>chat-widget</span><span class="size">140 KB</span></div>
        <div class="cell e"><span>ads</span><span class="size">120 KB</span></div>
        <div class="cell f"><span>other</span><span class="size">90 KB</span></div>
      </div>
    </div>
  </div>
  <div class="callout"><strong>Look here:</strong> the biggest blocks. Same site bundle + same trackers on every page usually means a shared problem, not one bad URL.</div>
</body>
</html>
